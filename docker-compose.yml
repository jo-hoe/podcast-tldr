# Full podcast-tldr pipeline, run locally end-to-end on a shared work volume.
#
# Two modes:
#
# Fan-out mode (recommended) — each episode runs the full chain in parallel:
#   docker compose up -d download orchestrator
#   docker compose logs -f orchestrator
#
# Serial mode — all episodes processed stage-by-stage:
#   docker compose up -d download transcribe summarize zip backup
#
# Each stage supports EPISODE_ID env var — empty = process all, set = single episode.

services:
  download:
    image: ghcr.io/jo-hoe/podcast-tldr/rss-audio-downloader:latest
    volumes:
      - "./config/download.yaml:/app/config/config.yaml:ro"
      - "./volume/work:/app/mount/work"
    environment:
      CONFIG_PATH: /app/config/config.yaml

  # Fan-out orchestrator: after download, fans out per-episode parallel chains
  # (transcribe -> summarize -> zip -> backup) with configurable parallelism.
  #
  # Usage:
  #   Linux/Mac:
  #     docker compose up -d download orchestrator
  #
  #   Windows Docker Desktop — enable TCP in Settings > General >
  #   "Expose daemon on tcp://localhost:2375 without TLS", then:
  #     DOCKER_HOST=tcp://host.docker.internal:2375 \
  #     docker compose up -d download orchestrator
  orchestrator:
    build:
      context: ./orchestrator
    image: podcast-tldr-orchestrator:local
    volumes:
      - "./volume/work:/app/mount/work"
      # Linux/Mac: mount Docker socket
      - "/var/run/docker.sock:/var/run/docker.sock"
      - ".:/repo:ro"
    working_dir: /repo
    environment:
      WORK_DIR: /app/mount/work
      MAX_PARALLEL: "${MAX_PARALLEL:-4}"
      PODCAST_TLDR_BACKUP_TOKEN: "${PODCAST_TLDR_BACKUP_TOKEN:-}"
      # Auto-detected from cwd; override if needed
      COMPOSE_FILES: ""
      # Pass through DOCKER_HOST for Windows TCP mode
      DOCKER_HOST: "${DOCKER_HOST:-}"
    depends_on:
      download:
        condition: service_completed_successfully

  transcribe:
    image: ghcr.io/jo-hoe/podcast-tldr/whisper-transcriber:latest
    volumes:
      - "./config/transcribe.yaml:/app/config/config.yaml:ro"
      - "./volume/work:/app/mount/work"
      - "./volume/models:/app/mount/models"
    environment:
      CONFIG_PATH: /app/config/config.yaml
      # Set EPISODE_ID to process a single episode (fan-out mode); empty = all.
      EPISODE_ID: "${EPISODE_ID:-}"
    # Request the NVIDIA GPU runtime when available. Requires:
    #   - nvidia-container-toolkit installed on the host
    #   - Docker daemon configured with the nvidia runtime
    # Set device: cpu in config/transcribe.yaml to skip GPU use on hosts without one.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      download:
        condition: service_completed_successfully

  summarize:
    image: ghcr.io/jo-hoe/podcast-tldr/llm-summarizer:latest
    volumes:
      - "./config/summarize.yaml:/app/config/config.yaml:ro"
      - "./config/prompt.txt:/app/config/prompt.txt:ro"
      - "./volume/work:/app/mount/work"
    environment:
      CONFIG_PATH: /app/config/config.yaml
      EPISODE_ID: "${EPISODE_ID:-}"
      # Not required: config/summarize.yaml points at the keyless ai-proxy. Only
      # set this if you switch baseURL to the litellm sidecar with a master key.
      LITELLM_API_KEY: "${LITELLM_API_KEY:-none}"
    depends_on:
      transcribe:
        condition: service_completed_successfully

  zip:
    image: ghcr.io/jo-hoe/podcast-tldr/artifact-zipper:latest
    volumes:
      - "./config/zip.yaml:/app/config/config.yaml:ro"
      - "./volume/work:/app/mount/work"
    environment:
      CONFIG_PATH: /app/config/config.yaml
      EPISODE_ID: "${EPISODE_ID:-}"
    depends_on:
      summarize:
        condition: service_completed_successfully

  backup:
    image: ghcr.io/jo-hoe/podcast-tldr/git-archive-backup:latest
    volumes:
      - "./config/backup.yaml:/app/config/config.yaml:ro"
      - "./volume/work:/app/mount/work"
    environment:
      CONFIG_PATH: /app/config/config.yaml
      EPISODE_ID: "${EPISODE_ID:-}"
      PODCAST_TLDR_BACKUP_TOKEN: "${PODCAST_TLDR_BACKUP_TOKEN:-}"
    depends_on:
      zip:
        condition: service_completed_successfully

  # OpenAI-compatible LLM gateway. The summarize stage points its baseURL here.
  # Provide backend credentials via environment and mount your own litellm config.
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "4000:4000"
    volumes:
      - "./litellm/config.yaml:/app/config.yaml:ro"
    environment:
      # Backend provider key(s) referenced by litellm/config.yaml.
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
