name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Lint YAML manifests
        uses: ibiqlik/action-yamllint@v3
        with:
          config_data: |
            extends: default
            rules:
              line-length: disable
              document-start: disable
              truthy:
                check-keys: false
              comments:
                min-spaces-from-content: 1
          file_or_dir: |
            config
            k8s
            argo
            litellm
            .github
