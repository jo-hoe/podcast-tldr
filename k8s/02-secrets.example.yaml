# Secrets consumed by the summarize and backup stages.
#
# DO NOT commit real values. Create this secret out-of-band, e.g.:
#   kubectl create secret generic podcast-tldr-secrets \
#     --from-literal=litellmApiKey='none' \
#     --from-literal=backupToken='ghp_...' \
#     --from-literal=backupRepoURL='https://github.com/you/your-archive.git'
#
# The backup stage reads repoURL from PODCAST_TLDR_BACKUP_REPO (injected below)
# so it never lands in a ConfigMap. The token is read from PODCAST_TLDR_BACKUP_TOKEN.
#
# This manifest is a placeholder template with empty values for reference only.
apiVersion: v1
kind: Secret
metadata:
  name: podcast-tldr-secrets
type: Opaque
stringData:
  litellmApiKey: ""
  backupToken: ""
  backupRepoURL: ""
