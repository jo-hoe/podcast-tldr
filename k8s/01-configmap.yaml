# Per-stage configuration mounted into every stage at /app/config.
# Generated from the files in ../config; keep them in sync.
apiVersion: v1
kind: ConfigMap
metadata:
  name: podcast-tldr-config
data:
  download.yaml: |
    logLevel: info
    workDir: /app/mount/work
    maxParallelDownloads: 4
    feeds:
      - url: https://feeds.megaphone.fm/sciencevs
        selector:
          startEpisode: 1
          endEpisode: 2
  transcribe.yaml: |
    logLevel: info
    workDir: /app/mount/work
    modelName: base
    modelCachePath: /app/mount/models
    device: cpu
    computeType: int8
    outputFormat: json
  summarize.yaml: |
    logLevel: info
    workDir: /app/mount/work
    # ai-proxy is OpenAI-compatible and needs no client key.
    baseURL: https://ai-proxy.johoe.duckdns.org/openai/v1
    model: gpt-5
    # gpt-5 reasoning model: uses max_completion_tokens and omits temperature.
    reasoningModel: true
    apiKeyEnv: LITELLM_API_KEY
    promptPath: /app/config/prompt.txt
    maxTokens: 8000
  prompt.txt: |
    You are an expert analyst producing a written report on a single podcast episode
    so the reader can understand it without listening. You are given two things: an
    authoritative METADATA block from the podcast feed (show, episode title, publish
    date, description) and a MACHINE TRANSCRIPT produced by automatic speech
    recognition.

    Important: the transcript is machine-generated and WILL contain transcription
    errors — misheard words, wrong names, garbled technical terms, missing
    punctuation, and misattributed speakers. Do not quote it verbatim when it is
    obviously wrong. Instead:
    - Use the metadata as the source of truth for the show name, episode title,
      guests, and overall topic, and let it guide your interpretation.
    - Silently correct likely mistranscriptions from context (names, products,
      brands, jargon, numbers that are clearly wrong). Prefer the most plausible
      intended meaning over the literal text.
    - If a claim, name, or figure is too garbled to reconstruct confidently, say so
      briefly rather than inventing detail. Never fabricate unsupported facts.

    Produce a well-structured Markdown report with these sections:

    # <Show> — <Episode title>
    A one-line dateline (publish date) and a 2–3 sentence overview of what the
    episode is about and its conclusion.

    ## Episode outline
    A short ordered walkthrough of how the episode unfolds (segments/topics in
    order), a few bullets — enough to see the shape of the discussion.

    ## Key takeaways
    The main findings, arguments, and conclusions as concise bullets. Include
    notable claims, data points, or studies mentioned, each with a brief caveat when
    the evidence is weak, anecdotal, or uncertain.

    ## Suggestions & follow-ups
    Actionable recommendations, practical advice, and things worth researching or
    following up on that a listener could take away from the episode.

    Be faithful, be concise, and be skeptical of the transcript's literal wording.
  zip.yaml: |
    logLevel: info
    workDir: /app/mount/work
  backup.yaml: |
    logLevel: info
    workDir: /app/mount/work
    repoURL: https://github.com/jo-hoe/media-archive.git
    tokenEnv: PODCAST_TLDR_BACKUP_TOKEN
    branch: main
    authorName: podcast-tldr-bot
    authorEmail: podcast-tldr-bot@users.noreply.github.com
