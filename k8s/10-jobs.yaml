# Plain Kubernetes Jobs for the pipeline.
#
# Two modes:
#
# Serial (all episodes, default):
#   kubectl apply -f k8s/10-jobs.yaml
#   kubectl wait --for=condition=complete job/rss-audio-downloader --timeout=2h
#   # ... repeat wait for each stage ...
#
# Fan-out (per-episode parallel chains, incremental archive commits):
#   Use Argo Workflows — see argo/workflow-template.yaml and `make run-argo`.
#   Argo's withParam fans out over episode IDs after download.
#
#   Alternatively, generate per-episode Jobs with the helper script:
#   bash scripts/k8s-fanout.sh [PARALLELISM]
#
# Each stage passes EPISODE_ID through to the container. When empty (default),
# the stage processes all episodes. When set, only that episode is processed.
# This is the same env var used by the Argo fan-out and compose fan-out.
#
# Prerequisites: 00-pvc, 01-configmap, 02-secrets (with backupRepoURL), 03-litellm.
apiVersion: batch/v1
kind: Job
metadata:
  name: rss-audio-downloader
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      securityContext: { runAsNonRoot: true, runAsUser: 65532, fsGroup: 65532 }
      containers:
        - name: download
          image: ghcr.io/jo-hoe/podcast-tldr/rss-audio-downloader:latest
          env: [{ name: CONFIG_PATH, value: /app/config/download.yaml }]
          volumeMounts:
            - { name: work, mountPath: /app/mount/work }
            - { name: config, mountPath: /app/config, readOnly: true }
      volumes:
        - { name: work, persistentVolumeClaim: { claimName: podcast-tldr-work } }
        - { name: config, configMap: { name: podcast-tldr-config } }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: whisper-transcriber
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: transcribe
          image: ghcr.io/jo-hoe/podcast-tldr/whisper-transcriber:latest
          env:
            - { name: CONFIG_PATH, value: /app/config/transcribe.yaml }
            # Set EPISODE_ID to process a single episode; empty = all (serial mode).
            - { name: EPISODE_ID, value: "" }
          resources:
            requests: { cpu: "500m", memory: 2Gi }
            limits: { cpu: "2", memory: 4Gi }
            # Uncomment to request a GPU (requires nvidia.com/gpu device plugin on the node
            # and device: cuda + computeType: float16 in config/transcribe.yaml):
            # limits:
            #   nvidia.com/gpu: "1"
            #   memory: 4Gi
          volumeMounts:
            - { name: work, mountPath: /app/mount/work }
            - { name: models, mountPath: /app/mount/models }
            - { name: config, mountPath: /app/config, readOnly: true }
      volumes:
        - { name: work, persistentVolumeClaim: { claimName: podcast-tldr-work } }
        - { name: models, persistentVolumeClaim: { claimName: podcast-tldr-models } }
        - { name: config, configMap: { name: podcast-tldr-config } }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: llm-summarizer
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      securityContext: { runAsNonRoot: true, runAsUser: 65532, fsGroup: 65532 }
      containers:
        - name: summarize
          image: ghcr.io/jo-hoe/podcast-tldr/llm-summarizer:latest
          env:
            - { name: CONFIG_PATH, value: /app/config/summarize.yaml }
            - { name: EPISODE_ID, value: "" }
            - name: LITELLM_API_KEY
              valueFrom: { secretKeyRef: { name: podcast-tldr-secrets, key: litellmApiKey } }
          volumeMounts:
            - { name: work, mountPath: /app/mount/work }
            - { name: config, mountPath: /app/config, readOnly: true }
      volumes:
        - { name: work, persistentVolumeClaim: { claimName: podcast-tldr-work } }
        - { name: config, configMap: { name: podcast-tldr-config } }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: artifact-zipper
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      securityContext: { runAsNonRoot: true, runAsUser: 65532, fsGroup: 65532 }
      containers:
        - name: zip
          image: ghcr.io/jo-hoe/podcast-tldr/artifact-zipper:latest
          env:
            - { name: CONFIG_PATH, value: /app/config/zip.yaml }
            - { name: EPISODE_ID, value: "" }
          volumeMounts:
            - { name: work, mountPath: /app/mount/work }
            - { name: config, mountPath: /app/config, readOnly: true }
      volumes:
        - { name: work, persistentVolumeClaim: { claimName: podcast-tldr-work } }
        - { name: config, configMap: { name: podcast-tldr-config } }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: git-archive-backup
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      securityContext: { runAsNonRoot: true, runAsUser: 65532, fsGroup: 65532 }
      containers:
        - name: backup
          image: ghcr.io/jo-hoe/podcast-tldr/git-archive-backup:latest
          env:
            - { name: CONFIG_PATH, value: /app/config/backup.yaml }
            - { name: EPISODE_ID, value: "" }
            - name: PODCAST_TLDR_BACKUP_TOKEN
              valueFrom: { secretKeyRef: { name: podcast-tldr-secrets, key: backupToken } }
            - name: PODCAST_TLDR_BACKUP_REPO
              valueFrom: { secretKeyRef: { name: podcast-tldr-secrets, key: backupRepoURL } }
          volumeMounts:
            - { name: work, mountPath: /app/mount/work }
            - { name: config, mountPath: /app/config, readOnly: true }
      volumes:
        - { name: work, persistentVolumeClaim: { claimName: podcast-tldr-work } }
        - { name: config, configMap: { name: podcast-tldr-config } }
