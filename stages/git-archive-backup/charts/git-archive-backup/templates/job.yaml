apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "git-archive-backup.name" . }}
  labels:
    {{- include "git-archive-backup.labels" . | nindent 4 }}
spec:
  backoffLimit: {{ .Values.job.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "git-archive-backup.labels" . | nindent 8 }}
    spec:
      restartPolicy: {{ .Values.job.restartPolicy }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ include "git-archive-backup.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: CONFIG_PATH
              value: /app/config/config.yaml
            # The git access token is injected from a Secret so it never appears
            # in the ConfigMap or on disk. The env var name must match the
            # tokenEnv in config.yaml.
            - name: {{ .Values.config.tokenEnv | default "PODCAST_TLDR_BACKUP_TOKEN" }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.existingSecret | default (include "git-archive-backup.name" .) }}
                  key: {{ .Values.secret.tokenKey }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
            - name: work
              mountPath: {{ .Values.workVolume.mountPath }}
      volumes:
        - name: config
          configMap:
            name: {{ include "git-archive-backup.name" . }}
        - name: work
          {{- if .Values.workVolume.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.workVolume.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
