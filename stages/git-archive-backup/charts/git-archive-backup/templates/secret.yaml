{{- /*
The git access token for the private archive repository. Rendered only when a
token value is provided; otherwise the operator is expected to supply an
existing Secret (see values.yaml: secret.existingSecret).
*/ -}}
{{- if and .Values.secret.create .Values.secret.token }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "git-archive-backup.name" . }}
  labels:
    {{- include "git-archive-backup.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.secret.tokenKey }}: {{ .Values.secret.token | quote }}
{{- end }}
