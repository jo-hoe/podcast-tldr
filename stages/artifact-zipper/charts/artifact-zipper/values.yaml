# Default values for artifact-zipper.

image:
  repository: ghcr.io/jo-hoe/artifact-zipper
  tag: latest
  pullPolicy: IfNotPresent

# The zip stage runs to completion as a Kubernetes Job.
job:
  # backoffLimit is the number of retries before the Job is marked failed.
  backoffLimit: 2
  # restartPolicy for the pod. Never or OnFailure are valid for Jobs.
  restartPolicy: Never

# Shared work directory. In a real pipeline this is backed by a ReadWriteMany PVC
# so this stage can read the transcripts produced upstream and write the bundles
# that downstream stages consume.
workVolume:
  # existingClaim, when set, mounts an already-provisioned PVC instead of the
  # emptyDir default (which does not survive the Job and is only useful for demos).
  existingClaim: ""
  mountPath: /app/mount/work

# Inline config.yaml rendered into a ConfigMap and mounted at /app/config.
config:
  logLevel: info
  workDir: /app/mount/work

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

# Pod security context — run as a non-root user (matches the distroless nonroot image).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
