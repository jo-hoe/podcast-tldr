apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "llm-summarizer.name" . }}
  labels:
    {{- include "llm-summarizer.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- toYaml .Values.config | nindent 4 }}
  prompt.txt: |
    {{- .Values.prompt | nindent 4 }}
{{- if not .Values.apiKey.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "llm-summarizer.name" . }}-apikey
  labels:
    {{- include "llm-summarizer.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.config.apiKeyEnv }}: {{ .Values.apiKey.value | quote }}
{{- end }}
