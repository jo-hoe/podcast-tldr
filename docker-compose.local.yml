# Local run override: build images from the stages/ subdirectories instead of
# pulling from ghcr.io. Useful for iterating locally before pushing a release tag.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d \
#     download transcribe summarize zip backup
#
# Personal config overrides (gitignored, never committed):
#   cp config/download.yaml config/download.local.yaml && $EDITOR config/download.local.yaml
#   cp config/backup.yaml   config/backup.local.yaml   && $EDITOR config/backup.local.yaml
# To mount them, add a third compose override that remaps the .local.yaml volume paths.

services:
  download:
    build:
      context: ./stages/rss-audio-downloader
    image: rss-audio-downloader:local

  transcribe:
    build:
      context: ./stages/whisper-transcriber
    image: whisper-transcriber:local

  summarize:
    build:
      context: ./stages/llm-summarizer
    image: llm-summarizer:local

  zip:
    build:
      context: ./stages/artifact-zipper
    image: artifact-zipper:local

  backup:
    build:
      context: ./stages/git-archive-backup
    image: git-archive-backup:local
