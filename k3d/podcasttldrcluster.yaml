apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: podcasttldrcluster # (will still be prefixed with `k3d-`)
servers: 1
agents: 1
ports:
  - port: 4000:4000 # expose the LiteLLM proxy on the host loadbalancer
    nodeFilters:
      - loadbalancer
  - port: 2746:2746 # expose the Argo Workflows UI on the host loadbalancer
    nodeFilters:
      - loadbalancer
kubeAPI:
  # setting port and IP on Windows explicitly as the default k3d port can lead to
  # kubectl not being able to connect
  hostIP: "127.0.0.1"
  hostPort: "6550"
registries:
  create:
    name: registry.localhost
    host: "0.0.0.0"
    hostPort: "5000"
options:
  k3s:
    extraArgs:
      # Pass NVIDIA GPU device plugin to the k3s agent node so Pods can request
      # nvidia.com/gpu resources. Requires nvidia-container-toolkit on the host
      # and the nvidia runtime registered with Docker/containerd.
      # Remove if running without a GPU.
      - arg: "--gpus=all"
        nodeFilters:
          - agent:0
