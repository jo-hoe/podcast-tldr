logLevel: info
workDir: /app/mount/work
# Model size: tiny, base, small, medium, large-v2, large-v3.
modelName: base
modelCachePath: /app/mount/models
# device: cpu → works everywhere; device: cuda → 10-20x faster with CUDA 12.x GPU.
device: cpu
# int8 fastest on CPU; float16 recommended for CUDA.
computeType: int8
outputFormat: json
# language: force transcription language (e.g. "en"). Empty = auto-detect.
# Set to avoid mis-detection on podcasts with a known language.
language: ""
# maxParallelEpisodes: concurrent transcriptions (1=sequential).
# On CPU: sensible range 1-4 depending on cores. On CUDA: keep at 1.
maxParallelEpisodes: 1
